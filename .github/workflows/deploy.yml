name: 部署到 GitHub Pages

# 触发条件：
#   1) 推送到 main 分支（你上传/更新文件后自动上线）
#   2) 手动在 Actions 页面点击 Run workflow
#   3) 每日 11:00（北京时间）自动重新部署一次 —— 即「每日保活」，
#      静态站点本不会被回收，此任务仅确保站点配置/缓存始终最新。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'   # UTC 03:00 = 北京 11:00

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 注意：GitHub 不允许工作流自动创建 Pages 站点（会报 Resource not accessible by integration）。
      # 首次使用必须由仓库主人在 Settings → Pages → Source 手动选一次「GitHub Actions」，
      # 之后本工作流即可全自动部署，无需再手动操作。
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包站点产物（仓库根目录即站点文件）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
